<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud BT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #050505;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 56px 20px 64px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 22px;
      display: block;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      color: #ffffff;
      margin-bottom: 34px;
      letter-spacing: 0.3px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 62px;
      padding: 16px 24px;
      border-radius: 2px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .link-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .link-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="avatar" class="avatar"
